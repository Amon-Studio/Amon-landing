<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Amon</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --ink: #1a1a1a; --muted: #8a8a8a; }

    body {
      background: linear-gradient(180deg, #ffffff 0%, #f7f7f7 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: "Arimo", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Grain subtil sur le fond (texture SVG inline, derrière le contenu) */
    .noise {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.1;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='120'%20height='120'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 120px 120px;
    }

    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      animation: pageFadeIn 0.6s ease both;
    }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }

    .logo { width: clamp(120px, 14vw, 180px); height: auto; }

    h1 {
      font-size: clamp(1.4rem, 3.5vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    p { color: var(--muted); }

    .home {
      margin-top: 0.5rem;
      padding: 0.5rem 1.1rem;
      border: 1px solid #d8d8d8;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .home:hover { color: var(--ink); }

    footer {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.5rem 2rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid #eee;
    }

    footer nav { display: flex; gap: 1.75rem; }
    footer a { color: var(--muted); text-decoration: none; transition: color 0.15s ease; }
    footer a:hover { color: var(--ink); }

    @media (max-width: 520px) {
      footer { flex-direction: column; gap: 0.75rem; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <main>
    <img class="logo" src="logo.png" alt="Amon" />
    <h1>Page not found</h1>
    <p>This page doesn’t exist, or it moved.</p>
    <a class="home" href="./">Back home</a>
  </main>

  <footer>
    <span>© 2026 Amon Studio. All rights reserved.</span>
    <nav>
      <a href="mailto:contact@amonstudio.io">Contact</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </footer>
</body>
</html>
